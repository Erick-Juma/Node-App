<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erevuka Project Assistant</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

    <div class="main">

        <div class="title-container">
            <h1>Erevuka Project Assistant</h1>
        </div>

        <button class="chatbot-toggler">Platform Assistant</button>

        <div class="chatbot">
            <header>
                <h2>
                    <button class="close-btn" aria-label="Close chat">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <path d="M6 6l12 12M18 6L6 18" />
                        </svg>
                    </button>
                    <button id="maximize-btn" aria-label="Maximize chat">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="4" y="4" width="16" height="16" rx="2" />
                        </svg>
                    </button>
                </h2>
            </header>
            <ul class="chatbox">
                <li class="chat incoming">
                    <span>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                            <path d="M12 2a1 1 0 0 1 1 1v1.06A6 6 0 0 1 18 10v1a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-1v1a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2v-1H6a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2v-1a6 6 0 0 1 5-5.92V3a1 1 0 0 1 1-1zm-3 9a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm6 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/>
                        </svg>
                    </span>
                    <p>Hi! Ask me anything about the Erevuka project.</p>
                </li>
            </ul>
            <div class="chat-input">
                <textarea placeholder="Ask about Erevuka..." spellcheck="false"></textarea>
                <button id="send-btn" aria-label="Send message">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path d="M3 11l18-8-8 18-2-8-8-2z" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script src="./js/erevukaAssistant.js"></script>

</body>

</html>
