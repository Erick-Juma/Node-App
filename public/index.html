<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erevuka Chat</title>

    <!-- Style CSS -->
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

    <div class="main">

        <div class="title-container">
            <h1>Powered by Erevuka</h1>
        </div>

        <button class="chatbot-toggler">Ask AI</button>

        <div class="chatbot">
            <header>
                <h2>
                    <span class="close-btn"> X</span>
                    <span id="maximize-btn">🗖</span>
                </h2>
            </header>
            <ul class="chatbox">
                <li class="chat incoming">
                    <span>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
                            fill="currentColor">
                            <path
                                d="M12 2a1 1 0 0 1 1 1v1.06A6 6 0 0 1 18 10v1a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-1v1a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2v-1H6a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2v-1a6 6 0 0 1 5-5.92V3a1 1 0 0 1 1-1zm-3 9a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm6 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z" />
                        </svg>
                    </span>
                    <p>Hi there! How can I assist you today?</p>
                </li>
            </ul>
            <div class="chat-input">
                <textarea placeholder="Enter a message..." spellcheck="false"></textarea>
                <span id="send-btn"><img src="/images/arrow-image.png" alt=""></span>
            </div>
        </div>
    </div>

    <!-- Chat config data (kept separate from the script that consumes it) -->
    <script id="chat-config" type="application/json">
    {
        "platform_id": "Chat application",
        "user_name": "Admin Chatbot"
    }
    </script>

    <!-- Script JS -->
    <script src="./js/script.js"></script>

</body>

</html>
